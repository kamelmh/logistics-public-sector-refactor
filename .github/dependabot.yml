# Dependabot config — automatic updates for GitHub Actions
# See: https://docs.github.com/code-security/dependabot

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Algiers"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group patch-level updates together to reduce PR noise
    groups:
      actions-minor:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
