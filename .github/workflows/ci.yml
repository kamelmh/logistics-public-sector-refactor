name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  PYTHON_VERSION: '3.x'
  THESIS_DOCX: Research_and_Development/Thesis_Surgical_Edit/output/Memoire_DSS_Logistique_ElBayadh.docx
  PAPER_DOCX: Research_and_Development/Thesis_Surgical_Edit/output/English_Research_Paper_IEEE.docx
  PAPER_PDF: Research_and_Development/Thesis_Surgical_Edit/output/English_Research_Paper_IEEE.pdf

jobs:
  # ──────────────────────────────────────────────────────
  # THESIS — Main gate (Windows-native scripts, must pass)
  # ──────────────────────────────────────────────────────
  thesis:
    name: Thesis build & verify
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      # NOTE: submodules NOT fetched — some submodules have filename lengths
      # exceeding Windows MAX_PATH (260 chars), causing checkout failures.
      # CI only needs main repo files (MD sources + Python scripts + build tools).

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install python-docx
      run: pip install python-docx lxml

    - name: Setup Pandoc
      run: choco install pandoc --no-progress -y

    - name: Setup MiKTeX (for PDF)
      continue-on-error: true
      run: choco install miktex --no-progress -y

    - name: Build thesis DOCX
      run: pwsh -File Thesis_Surgical_Edit/build-thesis.ps1

    - name: Verify thesis DOCX (28 checks)
      run: |
        python Thesis_Surgical_Edit/style/verify_docx_checks.py "${{ env.THESIS_DOCX }}"

    - name: Build English paper DOCX
      run: pwsh -File Thesis_Surgical_Edit/build-english-paper.ps1

    - name: Verify English paper (12 checks)
      run: pwsh -File Thesis_Surgical_Edit/verify-english-paper.ps1

    - name: Build English paper PDF
      continue-on-error: true
      run: pwsh -File Thesis_Surgical_Edit/build-english-paper-pdf.ps1

    - name: Upload thesis DOCX
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: thesis-docx
        path: ${{ env.THESIS_DOCX }}

    - name: Upload English paper DOCX
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: english-paper-docx
        path: ${{ env.PAPER_DOCX }}

    - name: Upload English paper PDF
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: english-paper-pdf
        path: ${{ env.PAPER_PDF }}

    - name: Upload submission package
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: submission-package
        path: |
          Thesis_Surgical_Edit/submission/*.md
          Thesis_Surgical_Edit/English_Research_Paper.md

  # ──────────────────────────────────────────────────────
  # ERP — Requires Excel COM (self-hosted only)
  # ──────────────────────────────────────────────────────
  erp:
    name: ERP workbook build
    runs-on: windows-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
      # NOTE: submodules intentionally skipped (see thesis job comment)

    - name: Check for Excel
      id: check-excel
      shell: pwsh
      run: |
        $paths = @(
          "C:\Program Files\Microsoft Office\root\Office16\EXCEL.EXE",
          "C:\Program Files (x86)\Microsoft Office\root\Office16\EXCEL.EXE",
          "C:\Program Files\Microsoft Office\Office16\EXCEL.EXE",
          "C:\Program Files (x86)\Microsoft Office\Office14\EXCEL.EXE"
        )
        $found = $null
        foreach ($p in $paths) {
          if (Test-Path $p) { $found = $p; break }
        }
        if ($found) {
          Write-Host "Excel found: $found"
          "excel_found=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        } else {
          Write-Host "Excel not found on this runner (expected: GA runners lack Office)"
          "excel_found=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        }

    - name: Run ERP full pipeline (vba-check → build → verify → macros → audit)
      if: steps.check-excel.outputs.excel_found == 'true'
      continue-on-error: true
      id: pipeline
      run: |
        & "vbe-auto\pipeline-full.ps1" -SkipBuild:$false -ContinueOnError

    - name: Run DSS audit (standalone)
      if: steps.check-excel.outputs.excel_found == 'true'
      continue-on-error: true
      run: |
        & "milestone_13_2\public-lsm\tests\dss-audit.ps1"

    - name: Run standalone verify (for comparison)
      if: steps.check-excel.outputs.excel_found == 'true'
      continue-on-error: true
      id: verify
      run: |
        & "vbe-auto\verify.ps1" -ConfigPath "vbe-auto\vbe-auto-config.json"

    - name: Upload pipeline results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-results
        path: vbe-auto/results/pipeline-report_*.json

    - name: Upload verification results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verify-results
        path: vbe-auto/results/verify_results_*.json

    - name: Upload test logs (if any)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-output
        path: |
          **/test-*.log
          **/test-*.txt
          **/test-*.xml

    - name: Upload build artifact (ERP workbook)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: erp-workbook
        path: ERP_v13.2.xlsm

  # ──────────────────────────────────────────────────────
  # LINT — Code quality checks
  # ──────────────────────────────────────────────────────
  lint:
    name: Lint (PowerShell + Python)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install PSScriptAnalyzer
      run: |
        sudo pwsh -c 'Install-Module -Name PSScriptAnalyzer -Force -Scope AllUsers'

    - name: Run PSScriptAnalyzer on build scripts
      shell: pwsh
      run: |
        # Run separately per file to avoid string[] to string coercion bug
        $exitCode = 0
        @(
          "Thesis_Surgical_Edit/build-thesis.ps1",
          "Thesis_Surgical_Edit/build-english-paper.ps1",
          "Thesis_Surgical_Edit/verify-thesis.ps1",
          "Thesis_Surgical_Edit/verify-english-paper.ps1"
        ) | ForEach-Object {
          $result = Invoke-ScriptAnalyzer -Path $_ -Recurse -ExcludeRule PSAvoidUsingCmdletAliases,PSUseDeclaredVarsMoreThanAssignments
          if ($result) { $result | Format-Table -AutoSize; $exitCode = 1 }
        }
        if ($exitCode -ne 0) { Write-Host "ScriptAnalyzer issues found" -ForegroundColor Yellow }
        exit 0  # Don't fail the job

    - name: Install ruff
      run: pip install ruff

    - name: Run ruff on Python scripts
      run: |
        ruff check Thesis_Surgical_Edit/style/*.py --ignore E501,W291 --quiet || true
