name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PYTHON_VERSION: '3.12'

jobs:
  psscriptanalyzer:
    name: PowerShell Lint (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -ExcludePath @(
            '*node_modules*', '*.venv*', '*mercury-agent*',
            '*explore-langflow*', '*explore-mini-browser*',
            '*ruflo*', '*opencode_updates*'
          ) -Severity @('Error', 'Warning')
          if ($results) { $results | Format-Table -AutoSize; exit 1 }
          Write-Host "PSScriptAnalyzer: OK (no errors or warnings)"

  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: |
          ruff check --ignore F403,F405 \
            links/02-Thesis/style/*.py \
            links/03-Build/cnepd-thesis-checker.py \
            ocr_demo.py \
          || true

  submodule-check:
    name: Submodule Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify submodule status
        run: |
          STATUS=$(git submodule status)
          if echo "$STATUS" | grep -q '^-'; then
            echo "FAIL: Uninitialized submodules found:"
            echo "$STATUS" | grep '^-'
            exit 1
          fi
          echo "All submodules: OK"

  thesis-build:
    name: Thesis PDF Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pandoc + texlive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc texlive-xetex texlive-lang-arabic texlive-latex-extra texlive-fonts-recommended
      - name: Build thesis PDF
        working-directory: Thesis_Surgical_Edit
        run: |
          if (Test-Path "build-thesis.ps1"); then
            pwsh -File build-thesis.ps1
          else
            echo "No build-thesis.ps1 found — trying pandoc directly"
            find . -name "*.md" -maxdepth 1 | head -5
          fi
        shell: pwsh
        continue-on-error: true
